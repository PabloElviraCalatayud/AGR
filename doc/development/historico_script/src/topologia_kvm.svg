  <text class="itf" x="380" y="170">ge0-0-3 .1</text>
  <text class="itf" x="530" y="218">ge0-0-5 .1</text>
  <text class="itf" x="380" y="240">ge0-0-1 .1</text>
  <text class="itf" x="380" y="308">ge0-0-5 .2</text>
