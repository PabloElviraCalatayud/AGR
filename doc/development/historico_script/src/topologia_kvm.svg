<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" width="900" height="730" font-family="DejaVu Sans, Arial, sans-serif">
  <style>
    .lnk { stroke: #2a6496; stroke-width: 2.2; fill: none; }
    .box { fill: #ffffff; stroke: #2a6496; stroke-width: 1.8; rx: 8; }
    .rtr { fill: #e9f0f6; }
    .srv { fill: #eef6ea; stroke: #3b7a2a; }
    .pc  { fill: #fff7e8; stroke: #b07a12; }
    .hst { fill: #f3ecf8; stroke: #6b3d8f; }
    .t1 { font-size: 14px; font-weight: bold; text-anchor: middle; fill: #1d1d1f; }
    .t2 { font-size: 11.5px; text-anchor: middle; fill: #333; }
    .net { font-size: 11.5px; font-weight: bold; fill: #2a6496; }
    .itf { font-size: 10.5px; fill: #8a3b12; }
  </style>
  <text x="450" y="22" text-anchor="middle" font-size="17" font-weight="bold">Laboratorio 3103 virtualizado con KVM (9 VMs + anfitrión)</text>

  <!-- enlaces -->
  <line class="lnk" x1="450" y1="90" x2="450" y2="175"/>
  <line class="lnk" x1="525" y1="200" x2="680" y2="200"/>
  <line class="lnk" x1="450" y1="225" x2="450" y2="315"/>
  <line class="lnk" x1="410" y1="365" x2="270" y2="455"/>
  <line class="lnk" x1="490" y1="365" x2="630" y2="455"/>
  <line class="lnk" x1="200" y1="505" x2="130" y2="615"/>
  <line class="lnk" x1="260" y1="505" x2="330" y2="615"/>
  <line class="lnk" x1="640" y1="505" x2="570" y2="615"/>
  <line class="lnk" x1="700" y1="505" x2="770" y2="615"/>

  <!-- etiquetas de red (bridge · subred) -->
  <text class="net" x="460" y="128">agr-srv · 10.100.0.0/24</text>
  <text class="net" x="560" y="176">agr-prof ·</text>
  <text class="net" x="560" y="191">10.200.0.0/30</text>
  <text class="net" x="460" y="275">agr-ab · 10.1.0.0/30</text>
  <text class="net" x="170" y="400">agr-bc · 10.2.0.0/30</text>
  <text class="net" x="580" y="400">agr-bd · 10.3.0.0/30</text>
  <text class="net" x="20" y="565">agr-red1 · 10.0.1.0/24</text>
  <text class="net" x="300" y="565">agr-red2 · 10.0.2.0/24</text>
  <text class="net" x="455" y="565">agr-red3 · 10.0.3.0/24</text>
  <text class="net" x="735" y="565">agr-red4 ·</text>
  <text class="net" x="735" y="579">10.0.4.0/24</text>

