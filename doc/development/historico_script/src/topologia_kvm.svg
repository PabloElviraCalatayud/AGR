  <rect class="box srv" x="365" y="40" width="170" height="50"/>
  <text class="t1" x="450" y="60">SRV (agr-srv)</text>
  <text class="t2" x="450" y="78">10.100.0.11 · Node.js :3000</text>

  <rect class="box rtr" x="375" y="175" width="150" height="50"/>
  <text class="t1" x="450" y="196">RA (agr-ra)</text>
  <text class="t2" x="450" y="213">router FRR</text>

  <rect class="box hst" x="680" y="172" width="200" height="56"/>
  <text class="t1" x="780" y="193">PC Profesor</text>
  <text class="t2" x="780" y="210">= anfitrión, 10.200.0.2</text>

  <rect class="box rtr" x="375" y="315" width="150" height="50"/>
  <text class="t1" x="450" y="336">RB (agr-rb)</text>
  <text class="t2" x="450" y="353">router FRR</text>

  <rect class="box rtr" x="155" y="455" width="150" height="50"/>
  <text class="t1" x="230" y="476">RC (agr-rc)</text>
  <text class="t2" x="230" y="493">router FRR</text>

  <rect class="box rtr" x="595" y="455" width="150" height="50"/>
  <text class="t1" x="670" y="476">RD (agr-rd)</text>
  <text class="t2" x="670" y="493">router FRR</text>

  <rect class="box pc" x="55" y="615" width="150" height="50"/>
  <text class="t1" x="130" y="636">PC1 (RED 1)</text>
  <text class="t2" x="130" y="653">10.0.1.10 gw .1</text>
  <rect class="box pc" x="255" y="615" width="150" height="50"/>
  <text class="t1" x="330" y="636">PC2 (RED 2)</text>
  <text class="t2" x="330" y="653">10.0.2.10 gw .1</text>
  <rect class="box pc" x="495" y="615" width="150" height="50"/>
  <text class="t1" x="570" y="636">PC3 (RED 3)</text>
  <text class="t2" x="570" y="653">10.0.3.10 gw .1</text>
  <rect class="box pc" x="695" y="615" width="150" height="50"/>
  <text class="t1" x="770" y="636">PC4 (RED 4)</text>
  <text class="t2" x="770" y="653">10.0.4.10 gw .1</text>

  <text x="450" y="705" text-anchor="middle" font-size="11" fill="#555">Cada red es un bridge Linux en el anfitrión; cada interfaz de VM, un tap (p. ej. rb-ge0-0-1) conectado al bridge. MAC fijas 52:54:00:aa:&lt;nodo&gt;:&lt;interfaz&gt;.</text>
</svg>
