  <text class="itf" x="275" y="450">ge0-0-5 .2</text>
  <text class="itf" x="565" y="450">ge0-0-5 .2</text>
  <text class="itf" x="115" y="520">ge0-0-1 .1</text>
  <text class="itf" x="265" y="520">ge0-0-2 .1</text>
  <text class="itf" x="570" y="520">ge0-0-3 .1</text>
  <text class="itf" x="715" y="520">ge0-0-4 .1</text>

