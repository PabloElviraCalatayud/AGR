<rect class="card hst" x="1360" y="400" width="425" height="209"/>
<text class="h" x="1372" y="422">Anfitrión = PC Profesor · 10.200.0.2</text>
<text class="s" x="1372" y="441">Preparación (parte2/red.sh, tras cada reinicio)</text>
<text class="c" xml:space="preserve" x="1372" y="456">modprobe -r vboxnetadp vboxnetflt vboxdrv</text>
<text class="c" xml:space="preserve" x="1372" y="471">modprobe kvm_amd</text>
<text class="c" xml:space="preserve" x="1372" y="486">ip link add br-… type bridge; ip link set br-… up</text>
<text class="c" xml:space="preserve" x="1372" y="501">   (los 9 bridges de este diagrama)</text>
<text class="c" xml:space="preserve" x="1372" y="516">sysctl -w net.bridge.bridge-nf-call-iptables=0</text>
<text class="s" x="1372" y="531">Su conexión al laboratorio</text>
<text class="c" xml:space="preserve" x="1372" y="546">ip addr add 10.200.0.2/30 dev br-prof</text>
<text class="c" xml:space="preserve" x="1372" y="561">ip route add &lt;red&gt; via 10.200.0.1   para:</text>
<text class="c" xml:space="preserve" x="1372" y="576">  10.100.0.0/24  10.1.0.0/30  10.2.0.0/30</text>
<text class="c" xml:space="preserve" x="1372" y="591">  10.3.0.0/30    10.0.1.0/24 … 10.0.4.0/24</text>
<rect class="card mld" x="20" y="70" width="640" height="314"/>
<text class="h" x="32" y="92">Base común de las 9 VMs (pasos 0–3)</text>
<text class="s" x="32" y="111">Imagen de Moodle</text>
<text class="c" xml:space="preserve" x="32" y="126">mkdir -p /var/lib/libvirt/images/lab3103</text>
<text class="c" xml:space="preserve" x="32" y="141">cp agr-vm-base.qcow2 …/lab3103/base.qcow2; chmod 444 base.qcow2</text>
<text class="s" x="32" y="156">Máquina molde (con Internet por la red NAT "default")</text>
<text class="c" xml:space="preserve" x="32" y="171">a$ qemu-img create -f qcow2 -F qcow2 -b base.qcow2 molde.qcow2</text>
<text class="c" xml:space="preserve" x="32" y="186">xml/molde.xml: &lt;interface type='network'&gt;&lt;source network='default'/&gt;</text>
<text class="c" xml:space="preserve" x="32" y="201">virsh net-start default; virsh define xml/molde.xml; virsh start molde</text>
<text class="s" x="32" y="216">Dentro del molde</text>
<text class="c" xml:space="preserve" x="32" y="231">apt install frr traceroute tcpdump curl git; systemctl disable --now frr</text>
<text class="c" xml:space="preserve" x="32" y="246">NodeSource 22: apt install nodejs</text>
<text class="c" xml:space="preserve" x="32" y="261">git clone SSR-master-server /opt/…; npm install --omit=dev</text>
<text class="c" xml:space="preserve" x="32" y="276">ssr-server.service  (creado, sin activar)</text>
<text class="c" xml:space="preserve" x="32" y="291">rm /etc/netplan/*.yaml; interfaces sólo con lo; truncate machine-id</text>
<text class="c" xml:space="preserve" x="32" y="306">poweroff</text>
<text class="s" x="32" y="321">Congelar</text>
<text class="c" xml:space="preserve" x="32" y="336">virsh undefine molde; chmod 444 molde.qcow2</text>
<text class="s" x="32" y="351">Cadena de discos</text>
<text class="c" xml:space="preserve" x="32" y="366">base.qcow2 ← molde.qcow2 ← srv, ra, rb, rc, rd, pc1…pc4 .qcow2</text>
<rect class="card mld" x="20" y="405" width="640" height="149"/>
<text class="h" x="32" y="427">XML de cada VM = plantilla de Moodle + 3 cambios</text>
<text class="c" xml:space="preserve" x="32" y="446">sed -e 's|&lt;name&gt;XXX&lt;/name&gt;|&lt;name&gt;VM&lt;/name&gt;|' \</text>
<text class="c" xml:space="preserve" x="32" y="461">    -e 's|/mnt/tmp/XXX/XXX.qcow2|/var/lib/libvirt/images/lab3103/VM.qcow2|' \</text>
<text class="c" xml:space="preserve" x="32" y="476">    -e 's|&lt;source bridge="XXX"/&gt;|&lt;source bridge="BRIDGE"/&gt;|' \</text>
<text class="c" xml:space="preserve" x="32" y="491">    plantilla.xml &gt; xml/VM.xml</text>
<text class="s" x="32" y="506">Varias tarjetas: un bloque &lt;interface&gt; por bridge, en orden (eth0, eth1…)</text>
<text class="c" xml:space="preserve" x="32" y="521">Cambiar el XML de una VM existente:</text>
<text class="c" xml:space="preserve" x="32" y="536">  virsh shutdown VM → undefine VM → define xml/VM.xml → start VM</text>
