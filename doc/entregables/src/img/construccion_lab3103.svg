<rect class="bg" width="1800" height="1660"/>
<text class="t" x="900" y="32" text-anchor="middle">Laboratorio 3103 en KVM: cómo se creó cada enlace y cada equipo</text>
<text class="n" x="900" y="52" text-anchor="middle">Órdenes del anfitrión con sudo · "Dentro" = en la consola de la VM (sudo virsh console &lt;vm&gt;, root/agr) · "a$ " = disco en /var/lib/libvirt/images/lab3103</text>
<line class="lnk" x1="900" y1="70" x2="900" y2="760"/>
<line class="lnk" x1="1100" y1="470" x2="1360" y2="470"/>
<line class="lnk" x1="900" y1="1040" x2="450" y2="1140"/>
<line class="lnk" x1="900" y1="1040" x2="1350" y2="1140"/>
<line class="lnk" x1="450" y1="1379" x2="225" y2="1470"/>
<line class="lnk" x1="450" y1="1379" x2="675" y2="1470"/>
<line class="lnk" x1="1350" y1="1379" x2="1125" y2="1470"/>
