<text class="c" xml:space="preserve" x="1147.0" y="1316">interfaces: eth0 10.3.0.2/30  eth1 10.0.3.1/24</text>
<text class="c" xml:space="preserve" x="1147.0" y="1331">            eth2 10.0.4.1/24</text>
<text class="c" xml:space="preserve" x="1147.0" y="1346">ip_forward=1 · systemctl enable --now frr</text>
<text class="c" xml:space="preserve" x="1147.0" y="1361">vtysh: ip route 0.0.0.0/0 10.3.0.1 · write memory</text>
