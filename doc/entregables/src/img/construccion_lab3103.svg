<rect class="br" x="750.0" y="311.0" width="300" height="48"/>
<text class="bh" x="900" y="326.0" text-anchor="middle">br-srv · 10.100.0.0/24</text>
<text class="bc" x="900" y="340.0" text-anchor="middle">ip link add br-srv type bridge</text>
<text class="bc" x="900" y="353.0" text-anchor="middle">ip link set br-srv up</text>
