<rect class="card srv" x="685.0" y="70" width="430" height="194"/>
<text class="h" x="697.0" y="92">SRV · servidor web · 10.100.0.11</text>
<text class="s" x="697.0" y="111">Disco y definición (anfitrión)</text>
<text class="c" xml:space="preserve" x="697.0" y="126">a$ qemu-img create -f qcow2 -F qcow2 \</text>
<text class="c" xml:space="preserve" x="697.0" y="141">       -b molde.qcow2 srv.qcow2</text>
<text class="c" xml:space="preserve" x="697.0" y="156">xml/srv.xml = plantilla + &lt;name&gt;srv&lt;/name&gt;</text>
<text class="c" xml:space="preserve" x="697.0" y="171">   + disco srv.qcow2 + eth0→br-srv</text>
<text class="c" xml:space="preserve" x="697.0" y="186">virsh define xml/srv.xml; virsh start srv</text>
<text class="s" x="697.0" y="201">Dentro</text>
<text class="c" xml:space="preserve" x="697.0" y="216">hostnamectl set-hostname srv</text>
<text class="c" xml:space="preserve" x="697.0" y="231">interfaces: eth0 10.100.0.11/24 gateway 10.100.0.1</text>
<text class="c" xml:space="preserve" x="697.0" y="246">systemctl enable --now ssr-server   (puerto 3000)</text>
<rect class="card rtr" x="685.0" y="380" width="430" height="254"/>
<text class="h" x="697.0" y="402">RA · router</text>
<text class="s" x="697.0" y="421">Disco y definición (anfitrión)</text>
<text class="c" xml:space="preserve" x="697.0" y="436">a$ qemu-img create -f qcow2 -F qcow2 \</text>
<text class="c" xml:space="preserve" x="697.0" y="451">       -b molde.qcow2 ra.qcow2</text>
<text class="c" xml:space="preserve" x="697.0" y="466">xml/ra.xml = plantilla + &lt;name&gt;ra&lt;/name&gt;</text>
<text class="c" xml:space="preserve" x="697.0" y="481">   + disco ra.qcow2 + eth0→br-srv</text>
<text class="c" xml:space="preserve" x="697.0" y="496">virsh define xml/ra.xml; virsh start ra</text>
<text class="c" xml:space="preserve" x="697.0" y="511">   eth1→br-ab  eth2→br-prof</text>
<text class="s" x="697.0" y="526">Dentro</text>
<text class="c" xml:space="preserve" x="697.0" y="541">hostnamectl set-hostname ra</text>
<text class="c" xml:space="preserve" x="697.0" y="556">interfaces: eth0 10.100.0.1/24  eth1 10.1.0.1/30</text>
<text class="c" xml:space="preserve" x="697.0" y="571">            eth2 10.200.0.1/30</text>
<text class="c" xml:space="preserve" x="697.0" y="586">echo net.ipv4.ip_forward=1 &gt; /etc/sysctl.d/99-router.conf</text>
<text class="c" xml:space="preserve" x="697.0" y="601">systemctl enable --now frr</text>
<text class="c" xml:space="preserve" x="697.0" y="616">vtysh: ip route 0.0.0.0/0 10.1.0.2 · write memory</text>
<rect class="card rtr" x="685.0" y="740" width="430" height="299"/>
<text class="h" x="697.0" y="762">RB · router</text>
<text class="s" x="697.0" y="781">Disco y definición (anfitrión)</text>
<text class="c" xml:space="preserve" x="697.0" y="796">a$ qemu-img create -f qcow2 -F qcow2 \</text>
<text class="c" xml:space="preserve" x="697.0" y="811">       -b molde.qcow2 rb.qcow2</text>
<text class="c" xml:space="preserve" x="697.0" y="826">xml/rb.xml = plantilla + &lt;name&gt;rb&lt;/name&gt;</text>
<text class="c" xml:space="preserve" x="697.0" y="841">   + disco rb.qcow2 + eth0→br-ab</text>
<text class="c" xml:space="preserve" x="697.0" y="856">virsh define xml/rb.xml; virsh start rb</text>
<text class="c" xml:space="preserve" x="697.0" y="871">   eth1→br-bc  eth2→br-bd</text>
<text class="s" x="697.0" y="886">Dentro</text>
<text class="c" xml:space="preserve" x="697.0" y="901">hostnamectl set-hostname rb</text>
<text class="c" xml:space="preserve" x="697.0" y="916">interfaces: eth0 10.1.0.2/30  eth1 10.2.0.1/30</text>
<text class="c" xml:space="preserve" x="697.0" y="931">            eth2 10.3.0.1/30</text>
<text class="c" xml:space="preserve" x="697.0" y="946">ip_forward=1 · systemctl enable --now frr</text>
<text class="c" xml:space="preserve" x="697.0" y="961">vtysh: ip route 0.0.0.0/0   10.1.0.1</text>
<text class="c" xml:space="preserve" x="697.0" y="976">       ip route 10.0.1.0/24 10.2.0.2</text>
<text class="c" xml:space="preserve" x="697.0" y="991">       ip route 10.0.2.0/24 10.2.0.2</text>
<text class="c" xml:space="preserve" x="697.0" y="1006">       ip route 10.0.3.0/24 10.3.0.2</text>
<text class="c" xml:space="preserve" x="697.0" y="1021">       ip route 10.0.4.0/24 10.3.0.2 · write memory</text>
