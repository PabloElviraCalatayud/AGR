<text class="c" xml:space="preserve" x="247.0" y="1316">interfaces: eth0 10.2.0.2/30  eth1 10.0.1.1/24</text>
<text class="c" xml:space="preserve" x="247.0" y="1331">            eth2 10.0.2.1/24</text>
<text class="c" xml:space="preserve" x="247.0" y="1346">ip_forward=1 · systemctl enable --now frr</text>
<text class="c" xml:space="preserve" x="247.0" y="1361">vtysh: ip route 0.0.0.0/0 10.2.0.1 · write memory</text>
<rect class="card rtr" x="1135.0" y="1140" width="430" height="239"/>
<text class="h" x="1147.0" y="1162">RD · router</text>
<text class="s" x="1147.0" y="1181">Disco y definición (anfitrión)</text>
<text class="c" xml:space="preserve" x="1147.0" y="1196">a$ qemu-img create -f qcow2 -F qcow2 \</text>
<text class="c" xml:space="preserve" x="1147.0" y="1211">       -b molde.qcow2 rd.qcow2</text>
